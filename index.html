<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Lean 4</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9c3d1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#faf6ee; --card:#fffdf8; --ink:#26211b; --muted:#6a6256; --rule:#d9cfbe;
  --accent:#9c3d1a; --accent-ink:#fffaf3; --accent-soft:#f3e6d6;
  --good:#37643a; --good-bg:#e7eedc; --bad:#9a2a2a; --bad-bg:#f6e2dd; --warn:#79580a; --warn-bg:#f4ead0;
  --code:#efe8da;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1c1915; --card:#24201b; --ink:#ece5d8; --muted:#a79e8f; --rule:#3b352c;
    --accent:#e58f5c; --accent-ink:#1c1915; --accent-soft:#33281c;
    --good:#8fc48a; --good-bg:#1f2b1d; --bad:#ee8f86; --bad-bg:#3a201d; --warn:#e3c06b; --warn-bg:#352b14;
    --code:#171410;
  }
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.6}
a{color:var(--accent)}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:10}
.skip:focus{left:0}
header.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:56rem;margin:0 auto;padding:.9rem 18px .6rem}
.brand{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.sub{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem 1rem;align-items:baseline;margin-top:.25rem}
nav{display:flex;flex-wrap:wrap;gap:.1rem 1.1rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.86rem}
nav a{color:var(--muted);text-decoration:none;padding:.15rem 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#today{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.8rem;color:var(--muted)}
main{max-width:56rem;margin:0 auto;padding:1rem 18px 3rem;outline:none}
footer{max-width:56rem;margin:0 auto;padding:1.2rem 18px 2.5rem;border-top:1px solid var(--rule);color:var(--muted);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.8rem}
h1{font-size:1.85rem;line-height:1.2;margin:.6rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.28rem;margin:1.7rem 0 .45rem;line-height:1.25}
h3{font-size:1.05rem;margin:1.1rem 0 .3rem}
p{margin:.55rem 0}
.muted{color:var(--muted)}
.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.9rem 1.1rem;margin:.9rem 0}
.card>h2:first-child{margin-top:.2rem}
.note{border-left:3px solid var(--muted);padding:.1rem 0 .1rem .9rem;margin:.9rem 0;color:var(--ink)}
.note.todo{border-left-color:var(--accent);background:var(--accent-soft);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.short{border-left-color:var(--good);background:var(--good-bg);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.mode{border-left-color:var(--warn);background:var(--warn-bg);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.mode.challenge{border-left-color:var(--good);background:var(--good-bg)}
.warn{background:var(--warn-bg);border:1px solid var(--warn);padding:.55rem .9rem;border-radius:3px;margin:.8rem 0;font-size:.95rem}
code{background:var(--code);padding:.05rem .3rem;border-radius:2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
pre{background:var(--code);padding:.7rem .9rem;border-radius:3px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.5;margin:.5rem 0;white-space:pre}
pre.out{border-left:3px solid var(--good)}
.label{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.8rem 0 .15rem;font-weight:600}
button,.btn{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.9rem;cursor:pointer;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:.45rem .95rem;margin:.25rem .4rem .25rem 0;text-decoration:none;display:inline-block}
button.secondary{background:transparent;color:var(--accent)}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea,input[type=text],input[type=search]{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:.55rem .65rem}
textarea.prose{font-family:inherit;font-size:1rem}
input[type=search]{max-width:26rem;font-family:inherit}
/* course map */
.chain{display:flex;flex-wrap:wrap;gap:.7rem .15rem;list-style:none;padding:0;margin:1rem 0}
.chain li{display:flex;align-items:center}
.chain li+li::before{content:"\203A";color:var(--muted);padding:0 .35rem;font-size:1.3rem}
.block{width:10.6rem;min-height:8.6rem;display:flex;flex-direction:column;border:1px solid var(--ink);border-radius:2px;padding:.6rem .7rem;background:var(--card);text-decoration:none;color:var(--ink)}
.block .n{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.block .t{font-weight:700;margin:.1rem 0 .4rem;flex:1;font-size:.95rem;line-height:1.25}
.block .st{font-family:system-ui,sans-serif;font-size:.78rem;font-weight:600;margin-bottom:.3rem}
.block.open{border:2px solid var(--accent)}
.block.open .st{color:var(--accent)}
.block.mastered{background:var(--good-bg);border-color:var(--good)}
.block.mastered .st{color:var(--good)}
.block.locked{border:1px dashed var(--muted);color:var(--muted);background:transparent;cursor:not-allowed}
a.block:hover{background:var(--accent-soft)}
.bar{position:relative;height:.45rem;background:var(--code);border:1px solid var(--rule)}
.bar>i{display:block;height:100%;background:var(--accent)}
.block.mastered .bar>i{background:var(--good)}
.bar>b{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.barlabel{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--muted)}
/* unit */
.stepper{display:flex;flex-wrap:wrap;gap:.2rem .3rem;margin:.7rem 0;border-bottom:1px solid var(--rule);padding-bottom:.5rem}
.stepper button{margin:0;background:transparent;color:var(--muted);border-color:transparent;font-size:.84rem;padding:.3rem .55rem;border-radius:2px}
.stepper button:hover{color:var(--ink);background:var(--accent-soft)}
.stepper button[aria-current="step"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.explain p,.explain li{max-width:42rem}
.opt{display:block;border:1px solid var(--rule);border-radius:3px;padding:.45rem .75rem;margin:.35rem 0;cursor:pointer;background:var(--card)}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-right:.55rem}
.opt.correct{border-color:var(--good);background:var(--good-bg);cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.opt .mark{font-family:system-ui,sans-serif;font-weight:700;margin-left:.5rem;font-size:.8rem}
.conf{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0;font-family:system-ui,sans-serif;font-size:.9rem}
.conf label{border:1px solid var(--rule);border-radius:3px;padding:.28rem .85rem;cursor:pointer;background:var(--card)}
.conf label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;font-weight:700;margin-bottom:.4rem}
.fb{border-radius:3px;padding:.65rem .9rem;margin:.7rem 0}
.fb.ok{background:var(--good-bg);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.sure-wrong{outline:2px dashed var(--warn)}
.tagline{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.7rem}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.55rem .8rem}
.stat b{display:block;font-size:1.5rem}
.stat small{color:var(--muted);font-family:system-ui,sans-serif}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
th,td{border-bottom:1px solid var(--rule);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
dl.terms{margin:.3rem 0}
dl.terms dt{font-weight:700;margin-top:.55rem}
dl.terms dd{margin:.1rem 0 0 0}
ul.marks{list-style:none;padding:0;font-family:system-ui,sans-serif;font-size:.92rem}
ul.marks li{padding:.28rem 0;border-bottom:1px solid var(--rule)}
.m-ok{color:var(--good);font-weight:700}.m-no{color:var(--bad);font-weight:700}.m-close{color:var(--warn);font-weight:700}
.check li{list-style:none;margin:.2rem 0}
.check{padding-left:0;font-family:system-ui,sans-serif;font-size:.92rem}
details{margin:.5rem 0}
summary{cursor:pointer;font-weight:700}
.msg{min-height:1.4rem;font-weight:600;font-family:system-ui,sans-serif;font-size:.9rem}
.cmp td:first-child,.cmp th:first-child{width:7rem}
@media (max-width:560px){ html{font-size:17px} .block{width:100%} .chain li{width:100%} .chain li+li::before{content:"\2193"} .chain{flex-direction:column} .chain li{flex-direction:column;align-items:stretch} }
@media print{ header.top,.stepper,button,footer{display:none} }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="top"><div class="top-in">
  <a class="brand" href="#/map">Learn Lean 4</a>
  <div class="sub">
    <nav id="nav" aria-label="Main"></nav>
    <span id="today"></span>
  </div>
</div></header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<noscript><p style="padding:1rem">This page needs JavaScript to run.</p></noscript>

<script>
(function () {
"use strict";
// All Lean code below was compiled on Lean 4.36.0; every "output" is copied from the real run.
const UNITS = [
{
  id: "u1", n: 1, title: "Lean as a calculator",
  hook: "Run your first Lean commands and meet the type that every token balance lives in.",
  goals: ["Use #eval to compute a value", "Use #check to ask for a value's type", "Tell Nat, Int, String, Bool and Prop apart", "Explain why 5 − 7 is 0 for Nat, and why that matters for balances"],
  explain: `
<p>A Lean file is checked <b>while you type</b>. In VS Code, put your cursor on a line and the <b>Infoview</b> panel on the right shows its result. There is no separate "run" button for these commands.</p>
<p><code>#eval</code> means "work this out and show me the answer". <code>#check</code> means "don't work it out, just tell me its <b>type</b>". In Lean every value has exactly one type, written after a colon: <code>42 : Nat</code> reads "42 has type Nat".</p>
<ul>
<li><b>Nat</b>: the natural numbers 0, 1, 2, …, with no upper limit. <b>There are no negative Nats.</b></li>
<li><b>Int</b>: whole numbers, including negatives.</li>
<li><b>String</b>: text in double quotes. <b>Bool</b>: <code>true</code> or <code>false</code>.</li>
<li><b>Prop</b>: a <i>statement</i> that might be true or false, like <code>3 ≤ 5</code>. You will prove Props in Unit 7.</li>
</ul>
<p><b>The key surprise:</b> since a Nat can't go below zero, Lean's subtraction on Nat stops at 0. So <code>5 - 7</code> is <code>0</code>. This is called <i>truncated subtraction</i>. If a balance is a Nat and you subtract more than it holds, you <b>silently</b> get 0. You don't get an error. You must check <code>amount ≤ balance</code> yourself, and Units 4, 6 and 8 build exactly that check.</p>`,
  worked: { code: `#eval 2 + 3
#eval 10 ^ 18          -- wei in one ether
#eval "Hello, " ++ "Lean"
#eval 5 - 7            -- Nat subtraction
#eval 7 / 2            -- whole-number division
#eval 7 % 2            -- remainder
#check 42
#check "wei"
#check 3 ≤ 5
#eval (5 : Int) - 7    -- same sum, as an Int`,
    output: `5
1000000000000000000
"Hello, Lean"
0
3
1
42 : Nat
"wei" : String
3 ≤ 5 : Prop
-2`,
    notes: ["<code>^</code> is \"to the power of\". 10<sup>18</sup> is the number of wei in one ether.", "<code>++</code> joins two strings.", "<code>5 - 7</code> gives 0 because both numbers are Nat.", "<code>/</code> on Nat throws away the remainder, and <code>%</code> gives you the remainder.", "<code>(5 : Int)</code> is a <i>type ascription</i>: \"treat this 5 as an Int\". Now negatives are allowed, so the answer is −2."] },
  bridge: `<p><b>Solidity:</b> since version 0.8.0, arithmetic on <code>uint256</code> is checked by default, so an underflow like 5 − 7 <b>reverts</b> the transaction instead of wrapping (you can opt out with <code>unchecked { }</code>). <b>Rust:</b> in debug builds integer overflow panics, and in release builds it wraps around unless overflow checks are turned on. Methods like <code>checked_sub</code> return an <code>Option</code> so you can handle failure. <b>Lean's Nat</b> does a third thing: it never overflows (no maximum) and floors at 0. Three languages, three different behaviours for the same sum. Knowing which one you're in is a real security skill.</p>`,
  faded: { prompt: "Fill the blank so Lean shows the type of the text \"wei\" (the output should be <code>\"wei\" : String</code>).", code: `#____ "wei"`, options: ["eval", "check", "type", "print"], answer: 1, why: "<code>#check</code> shows the type. <code>#eval</code> would show the value <code>\"wei\"</code> without its type." },
  quiz: [
    { id: "u1q1", tag: "nat-subtraction", q: "What does Lean print for this line?", code: "#eval 5 - 7", options: ["-2", "0", "An error", "2"], a: 1, why: "Both numbers are Nat, which has no negatives, so subtraction stops at 0 (truncated subtraction)." },
    { id: "u1q2", tag: "eval-vs-check", q: "What does <code>#check</code> do?", options: ["Computes the value and prints it", "Prints the type of an expression without computing it", "Checks the file for spelling mistakes", "Proves the expression is true"], a: 1, why: "#check reports the type, such as <code>42 : Nat</code>. #eval does the computing." },
    { id: "u1q3", tag: "types", q: "What does Lean print here?", code: "#check 3 ≤ 5", options: ["true", "3 ≤ 5 : Prop", "3 ≤ 5 : Bool", "Bool.true : Bool"], a: 1, why: "<code>3 ≤ 5</code> is a statement, so its type is Prop. #check doesn't decide whether it's true." },
    { id: "u1q4", tag: "nat-division", q: "What does Lean print?", code: "#eval 7 / 2", options: ["3.5", "4", "3", "1"], a: 2, why: "Division on Nat is whole-number division and drops the remainder. <code>7 % 2</code> would give the remainder, 1." },
    { id: "u1q5", tag: "types", q: "You need a number that can go negative (for example a profit or loss). Which type?", options: ["Nat", "Int", "String", "Prop"], a: 1, why: "Int includes negative numbers. Nat stops at 0." }
  ],
  challenge: { id: "u1c1", tag: "type-ascription", q: "What does Lean print?", code: "#eval (5 : Int) - 7", options: ["0", "-2", "An error", "2"], a: 1, why: "The ascription makes 5 an Int, and Lean then treats 7 as an Int too, so ordinary subtraction gives −2." },
  practice: { task: "Create a file <code>Unit1.lean</code> in VS Code, type the worked example line by line, and click each line to see the Infoview output. Then try <code>#eval 10 ^ 9</code> (wei in one gwei).", expected: "1000000000" }
},
{
  id: "u2", n: 2, title: "Definitions and functions",
  hook: "Name values, write functions that convert ether to wei, and read function types.",
  goals: ["Define a constant with def", "Write a function with typed inputs and an output type", "Call a function with arguments separated by spaces", "Read an arrow type like Nat → Nat → Nat"],
  explain: `
<p><code>def</code> gives a name to something: <code>def name : Type := value</code>. Once defined, the name can be used anywhere below it in the file.</p>
<p>A <b>function</b> is a definition with inputs. You write each input in brackets with its type, then the output type: <code>def etherToWei (eth : Nat) : Nat := eth * weiPerEther</code>.</p>
<p><b>Calling</b> a function needs no brackets or commas. You write the function name, then a space, then the arguments: <code>etherToWei 2</code>. With two inputs it looks like <code>gasCost 21000 30</code>.</p>
<p><b>Function types</b> use arrows. <code>Nat → Nat</code> means "give me a Nat and I'll give you a Nat". <code>gasCost</code> has two Nat inputs, so its type behaves like <code>Nat → Nat → Nat</code>. If you give only the first argument (<code>gasCost 21000</code>), you get back a function still waiting for the second one, with type <code>Nat → Nat</code>. This is called <i>partial application</i>.</p>
<p><code>fun (n : Nat) => n * 2</code> is a function without a name (an anonymous function, or "lambda").</p>`,
  worked: { code: `def weiPerGwei : Nat := 10 ^ 9
def weiPerEther : Nat := 10 ^ 18
def lamportsPerSol : Nat := 1000000000

def etherToWei (eth : Nat) : Nat := eth * weiPerEther
def solToLamports (sol : Nat) : Nat := sol * lamportsPerSol

#eval etherToWei 2
#eval solToLamports 3
#check etherToWei

def gasCost (gasUsed gasPriceGwei : Nat) : Nat :=
  gasUsed * gasPriceGwei * weiPerGwei

#eval gasCost 21000 30
#check gasCost 21000

def double := fun (n : Nat) => n * 2
#eval double 21`,
    output: `2000000000000000000
3000000000
etherToWei (eth : Nat) : Nat
630000000000000
gasCost 21000 : Nat → Nat
42`,
    notes: ["1 ether = 10<sup>18</sup> wei, 1 gwei = 10<sup>9</sup> wei, and 1 SOL = 10<sup>9</sup> lamports.", "21000 is the gas used by a plain ETH transfer. At a gas price of 30 gwei that costs 630,000,000,000,000 wei (0.00063 ETH).", "<code>(gasUsed gasPriceGwei : Nat)</code> is shorthand for two inputs that are both Nat.", "<code>gasCost 21000</code> on its own is a function still waiting for the gas price, so its type is <code>Nat → Nat</code>."] },
  bridge: `<p><b>Rust</b> equivalent: <code>fn ether_to_wei(eth: u128) -&gt; u128 { eth * WEI_PER_ETHER }</code>. Rust puts arguments in brackets with commas (<code>gas_cost(21000, 30)</code>), and Lean uses spaces (<code>gasCost 21000 30</code>). Rust's <code>u128</code> has a maximum value and Lean's <code>Nat</code> has none. That difference matters when you later prove things about a Rust program: a proof about unlimited Nats does not automatically hold for fixed-size integers.</p>`,
  faded: { prompt: "Complete the function so it converts SOL to lamports.", code: `def lamportsPerSol : Nat := 1000000000
def solToLamports (sol : Nat) : Nat := sol * ____`, options: ["sol", "lamportsPerSol", "Nat", "1000"], answer: 1, why: "Multiply the number of SOL by the named constant <code>lamportsPerSol</code>. Naming the constant once avoids typing the wrong number of zeros." },
  quiz: [
    { id: "u2q1", tag: "calling", q: "How do you call <code>gasCost</code> with gas 21000 and price 30?", options: ["gasCost(21000, 30)", "gasCost 21000 30", "gasCost[21000][30]", "21000.gasCost(30)"], a: 1, why: "In Lean, arguments follow the function name, separated by spaces." },
    { id: "u2q2", tag: "function-types", q: "What does Lean print?", code: "#check etherToWei", options: ["etherToWei : Nat", "etherToWei (eth : Nat) : Nat", "2000000000000000000", "Nat → Prop"], a: 1, why: "#check on a function shows its inputs and output type." },
    { id: "u2q3", tag: "partial-application", q: "What is the type of <code>gasCost 21000</code>?", options: ["Nat", "Nat → Nat", "Nat → Nat → Nat", "An error, because an argument is missing"], a: 1, why: "One of the two arguments has been supplied, so what's left is a function from the remaining Nat to a Nat." },
    { id: "u2q4", tag: "def-syntax", q: "Which line correctly defines a constant?", options: ["def fee : Nat = 5", "def fee : Nat := 5", "let fee: Nat := 5;", "fee : Nat := def 5"], a: 1, why: "The pattern is <code>def name : Type := value</code>, with <code>:=</code> rather than <code>=</code>." },
    { id: "u2q5", tag: "lambda", q: "What does <code>fun (n : Nat) => n * 2</code> create?", options: ["A theorem", "A function without a name that doubles its input", "A structure", "A loop"], a: 1, why: "<code>fun</code> builds an anonymous function. <code>double</code> in the example gave it a name." }
  ],
  challenge: { id: "u2c1", tag: "units", q: "<code>gasCost 21000 30</code> evaluates to 630000000000000. What unit is that number in?", options: ["gwei", "wei", "ether", "lamports"], a: 1, why: "The function multiplies by <code>weiPerGwei</code>, which converts gwei into wei." },
  practice: { task: "Write <code>def gweiToWei (g : Nat) : Nat := g * weiPerGwei</code> and run <code>#eval gweiToWei 30</code>.", expected: "30000000000" }
},
{
  id: "u3", n: 3, title: "Structures: modelling an account",
  hook: "Bundle related data into one value, the way a Solana account bundles an owner and a lamport balance.",
  goals: ["Declare a structure with named fields", "Create a value and read a field with dot notation", "Make an updated copy with the { x with … } syntax", "Explain why the original value doesn't change"],
  explain: `
<p>A <b>structure</b> groups named fields into one type, much like a row in a table. <code>structure Account where</code>, followed by one field per line with its type.</p>
<p>You build one with curly braces: <code>{ owner := "alice", lamports := 5000 }</code>, and read a field with a dot: <code>alice.lamports</code>.</p>
<p><code>deriving Repr</code> asks Lean to write the code that <i>prints</i> the structure (a <code>Repr</code> instance). If you forget it, <code>#eval alice</code> still works in Lean 4.36 because #eval generates one on the spot, but code that calls <code>repr alice</code> fails with <i>failed to synthesize instance of type class Repr Account</i>. So write it.</p>
<p><b>Lean values never change.</b> <code>{ acc with lamports := … }</code> builds a <i>new</i> Account that copies every field except the one you name. The old value is untouched. That's why <code>alice.lamports</code> is still 5000 after a deposit. Everything a function does shows up in what it <i>returns</i>, and that makes it much easier to prove things about it later.</p>`,
  worked: { code: `structure Account where
  owner    : String
  lamports : Nat
deriving Repr

def alice : Account := { owner := "alice", lamports := 5000 }

#eval alice
#eval alice.lamports

def deposit (acc : Account) (amount : Nat) : Account :=
  { acc with lamports := acc.lamports + amount }

#eval deposit alice 250
#eval alice.lamports`,
    output: `{ owner := "alice", lamports := 5000 }
5000
{ owner := "alice", lamports := 5250 }
5000`,
    notes: ["The fields are indented under <code>where</code>.", "<code>deposit</code> returns a <i>new</i> Account with 250 more lamports.", "The last line shows alice is still 5000. Nothing was changed in place."] },
  bridge: `<p><b>Rust</b> equivalent: <code>struct Account { owner: String, lamports: u64 }</code>. In Rust you would often write <code>fn deposit(acc: &amp;mut Account, amount: u64)</code> and change the account in place. Every Solana account really does carry a <code>lamports</code> balance. Tools that translate Rust into Lean (such as <b>Aeneas</b>, which Microsoft uses to verify Rust cryptography) turn exactly this kind of in-place change into a function that takes the old value and returns the new one, as in the Lean version above.</p>`,

{
  id: "u4", n: 4, title: "Inductive types and pattern matching",
  hook: "Describe instructions as a closed list of choices and handle each case, the same shape as a Rust enum with match.",
  goals: ["Declare an inductive type with several constructors", "Write a function by pattern matching on each case", "Use Option for an answer that might be missing", "Spot the bug that truncated subtraction causes"],
  explain: `
<p>An <b>inductive type</b> lists every possible shape a value can have. Each shape is a <i>constructor</i>, written after <code>|</code>, and a constructor can carry data: <code>| deposit (amount : Nat)</code>.</p>
<p>You use one with <b>pattern matching</b>. The function gives one line per constructor, and Lean picks the matching line. <code>.deposit n</code> is a short way to write <code>Instruction.deposit n</code>. Lean <b>refuses to accept the definition</b> if you forget a case. Leaving out the <code>.close</code> line is a compile error, not a bug you find later.</p>
<p><code>s!"deposit {n}"</code> builds a string with the value of <code>n</code> inserted.</p>
<p><b>Look closely at the worked example:</b> <code>applyIx 500 (.withdraw 900)</code> returns 0. The user withdrew 900 from 500 and nothing complained. That's truncated subtraction from Unit 1 turning into a real bug. The fix is <b>Option</b>: a value is either <code>some x</code> (here is the answer) or <code>none</code> (there is no valid answer). <code>safeWithdraw</code> returns <code>none</code> instead of pretending.</p>`,
  worked: { code: `inductive Instruction where
  | deposit  (amount : Nat)
  | withdraw (amount : Nat)
  | close
deriving Repr

def describe : Instruction → String
  | .deposit n  => s!"deposit {n}"
  | .withdraw n => s!"withdraw {n}"
  | .close      => "close account"

#eval describe (.deposit 100)

def applyIx (balance : Nat) : Instruction → Nat
  | .deposit n  => balance + n
  | .withdraw n => balance - n
  | .close      => 0

#eval applyIx 500 (.withdraw 200)
#eval applyIx 500 (.withdraw 900)   -- the bug

def safeWithdraw (balance amount : Nat) : Option Nat :=
  if amount ≤ balance then some (balance - amount) else none

#eval safeWithdraw 500 200
#eval safeWithdraw 500 900`,
    output: `"deposit 100"
300
0
some 300
none`,
    notes: ["Three constructors give three cases, and every function must handle all three.", "<code>applyIx 500 (.withdraw 900)</code> gives 0. That is the silent bug.", "<code>safeWithdraw</code> checks first and returns <code>none</code> when the withdrawal isn't allowed."] },
  bridge: `<p><b>Rust</b> has the same idea: <code>enum Instruction { Deposit(u64), Withdraw(u64), Close }</code> plus a <code>match</code>, and Rust also rejects a match that misses a case. This is the shape commonly used to decode and dispatch the instructions a Solana program receives. Lean's <code>Option</code> (<code>some</code>/<code>none</code>) is Rust's <code>Option</code> (<code>Some</code>/<code>None</code>).</p>`,
  faded: { prompt: "Complete the missing case so the function handles every instruction.", code: `def isWithdraw : Instruction → Bool
  | .withdraw _ => true
  | .deposit _  => false
  | ____        => false`, options: [".close", "_ =>", ".withdraw", "none"], answer: 0, why: "The remaining constructor is <code>.close</code>. Without that line Lean reports a missing case. (A wildcard <code>_</code> line would also work, but it hides which cases you meant.)" },
  quiz: [
    { id: "u4q1", tag: "nat-subtraction", q: "What does <code>applyIx 500 (.withdraw 900)</code> return?", options: ["-400", "0", "none", "An error"], a: 1, why: "500 − 900 on Nat floors to 0. That's why safeWithdraw exists." },
    { id: "u4q2", tag: "option", q: "What does <code>safeWithdraw 500 900</code> return?", options: ["0", "some 0", "none", "some (-400)"], a: 2, why: "900 ≤ 500 is false, so the else branch returns none." },
    { id: "u4q3", tag: "exhaustiveness", q: "You delete the <code>| .close => 0</code> line from applyIx. What happens?", options: ["It compiles and returns 0 for close", "Lean reports an error because a case is missing", "It returns none for close", "It crashes when run"], a: 1, why: "Lean checks that every constructor is handled before it accepts a definition." },
    { id: "u4q4", tag: "constructors", q: "How many constructors does Instruction have?", options: ["1", "2", "3", "4"], a: 2, why: "deposit, withdraw and close." },
    { id: "u4q5", tag: "rust-bridge", q: "Which Rust feature is the closest match to a Lean inductive type like Instruction?", options: ["struct", "enum", "trait", "Vec"], a: 1, why: "A Rust enum lists alternatives, and each alternative can carry data, just like constructors." }
  ],
  challenge: { id: "u4c1", tag: "option", q: "What does <code>safeWithdraw 500 500</code> return?", options: ["none", "some 0", "0", "some 500"], a: 1, why: "500 ≤ 500 is true, so it returns some (500 − 500) = some 0. Withdrawing everything is allowed." },
  practice: { task: "Add a constructor <code>| freeze</code> to Instruction. Notice Lean now reports errors in describe and applyIx. Add the missing cases (for applyIx, return <code>balance</code> unchanged).", expected: "No errors in the Infoview once every function handles .freeze" }
},
{
  id: "u5", n: 5, title: "Lists and recursion: a ledger",
  hook: "Store many accounts in a list and add up the total supply with a function that calls itself.",
  goals: ["Write list literals and use :: and ++", "Define a recursive function over a list", "Use map, filter and foldl", "Explain why recursion on a list must finish"],
  explain: `
<p>A <b>List</b> holds values of one type in order: <code>[1, 2, 3]</code>. Every list is either empty, <code>[]</code>, or an element stuck on the front of a smaller list, <code>a :: rest</code>. These are exactly List's two constructors (in Lean's own source they're called <code>nil</code> and <code>cons</code>).</p>
<p>So a function on lists usually has two cases, and the second one calls the function again on the smaller <code>rest</code>. That's <b>recursion</b>. Because <code>rest</code> is always shorter, it must eventually reach <code>[]</code>, and Lean checks this. A definition that might loop forever is rejected unless you tell Lean otherwise.</p>
<p>Ready-made tools: <code>map</code> applies a function to every element, <code>filter</code> keeps the elements that pass a test, and <code>foldl</code> walks the list carrying a running total. <code>(·.owner)</code> is shorthand for <code>fun a => a.owner</code>.</p>`,
  worked: { code: `def accounts : List Account :=
  [{ owner := "alice", lamports := 5000 },
   { owner := "bob",   lamports := 1200 },
   { owner := "carol", lamports := 300 }]

def total : List Account → Nat
  | []        => 0
  | a :: rest => a.lamports + total rest

#eval total accounts
#eval accounts.map (·.owner)
#eval (accounts.filter (fun a => a.lamports ≥ 1000)).map (·.owner)
#eval accounts.foldl (fun acc a => acc + a.lamports) 0
#eval 0 :: [1, 2]`,
    output: `6500
["alice", "bob", "carol"]
["alice", "bob"]
6500
[0, 1, 2]`,
    notes: ["This uses the Account structure from Unit 3.", "<code>total</code>: the empty list totals 0. Otherwise it's this account's lamports plus the total of the rest.", "<code>filter</code> keeps accounts with at least 1000 lamports, and then <code>map</code> takes their owners.", "<code>foldl</code> gets the same 6500 as total, by keeping a running sum that starts at 0."] },
  bridge: `<p><b>Rust</b>: <code>accounts.iter().map(|a| a.lamports).sum::&lt;u64&gt;()</code>. Same idea, different spelling. In blockchain terms, <code>total</code> is a <i>total supply</i> calculation, and in Unit 8 you'll prove a fact about it for <i>every possible</i> list, which no number of tests can do.</p>`,
  faded: { prompt: "Complete the recursive case to count how many accounts are in the list.", code: `def count : List Account → Nat
  | []        => 0
  | _ :: rest => 1 + ____`, options: ["count rest", "rest", "count", "1"], answer: 0, why: "Each account adds 1 to the count of the rest of the list. <code>_</code> means \"there is an element here, but I don't need its name\"." },
  quiz: [
    { id: "u5q1", tag: "recursion", q: "What is <code>total []</code>?", options: ["An error", "0", "none", "1"], a: 1, why: "The first case of total says the empty list totals 0." },
    { id: "u5q2", tag: "list-ops", q: "What does <code>#eval 0 :: [1, 2]</code> print?", options: ["[1, 2, 0]", "[0, 1, 2]", "[[0], 1, 2]", "3"], a: 1, why: "<code>::</code> puts an element on the front." },
    { id: "u5q3", tag: "list-ops", q: "Which tool keeps only the elements that pass a test?", options: ["map", "filter", "foldl", "::"], a: 1, why: "filter keeps the elements where the test returns true." },
    { id: "u5q4", tag: "termination", q: "Why does Lean accept <code>total</code> without complaint?", options: ["Lean never checks recursion", "Each recursive call is on a shorter list, so it must finish", "Because it uses Nat", "Because of deriving Repr"], a: 1, why: "Lean checks termination. Here the call is on <code>rest</code>, which is structurally smaller." }
  ],
  challenge: { id: "u5c1", tag: "list-ops", q: "Using the same three accounts, what does <code>(accounts.filter (fun a => a.lamports < 1000)).length</code> give?", options: ["0", "1", "2", "3"], a: 1, why: "Only carol (300) has fewer than 1000 lamports." },
  practice: { task: "Write <code>def richest : List Account → Nat</code> that returns the largest balance (use <code>max</code>, with 0 for the empty list) and evaluate it on <code>accounts</code>.", expected: "5000" }
},
{
  id: "u6", n: 6, title: "Errors as values: a safe transfer",
  hook: "Return either a success or a clear failure reason, Lean's version of Solidity's require and Rust's Result.",
  goals: ["Use Except to return ok or error", "Write a transfer that refuses overdrafts", "Chain steps with do and ←, stopping at the first failure", "Compare Except with Rust Result and Solidity require"],
  explain: `
<p><code>Except ε α</code> means "either an error of type ε, or a success of type α". You build a success with <code>.ok value</code> and a failure with <code>.error reason</code>.</p>
<p><code>Account × Account</code> is a <b>pair</b> type: two accounts together, written <code>(a, b)</code>. A transfer changes two accounts, so it returns a pair.</p>
<p><b>do-notation</b> lets you write steps one after another. <code>let (a1, b1) ← transfer …</code> means "run this, and if it succeeded, unpack the pair and carry on. If it failed, stop and return that error". <code>return</code> wraps the final answer as a success.</p>`,
  worked: { code: `def transfer (src dst : Account) (amount : Nat)
    : Except String (Account × Account) :=
  if amount ≤ src.lamports then
    .ok ({ src with lamports := src.lamports - amount },
         { dst with lamports := dst.lamports + amount })
  else
    .error s!"insufficient funds: has {src.lamports}, needs {amount}"

def alice : Account := { owner := "alice", lamports := 5000 }
def bob   : Account := { owner := "bob",   lamports := 1200 }

#eval transfer alice bob 2000
#eval transfer alice bob 9000

def twoTransfers : Except String (Account × Account) := do
  let (a1, b1) ← transfer alice bob 2000
  let (b2, a2) ← transfer b1 a1 500
  return (a2, b2)

#eval twoTransfers`,
    output: `Except.ok ({ owner := "alice", lamports := 3000 }, { owner := "bob", lamports := 3200 })
Except.error "insufficient funds: has 5000, needs 9000"
Except.ok ({ owner := "alice", lamports := 3500 }, { owner := "bob", lamports := 2700 })`,
    notes: ["Because of the check <code>amount ≤ src.lamports</code>, the subtraction can never floor to 0.", "The 9000 transfer is refused with a reason, and neither account changes.", "twoTransfers: alice sends bob 2000, then bob sends 500 back, so alice ends at 3500 and bob at 2700. 6200 in total before and after."] },
  bridge: `<p><b>Solidity</b>: <code>require(balance &gt;= amount, "insufficient funds");</code> reverts the whole transaction if the condition fails. <b>Rust</b>: a function returning <code>Result&lt;(Account, Account), String&gt;</code> with <code>Ok(…)</code> and <code>Err(…)</code>, where the <code>?</code> operator stops at the first error. Lean's <code>←</code> inside <code>do</code> plays the role of Rust's <code>?</code>.</p>`,
  faded: { prompt: "Complete the failure branch so an overdraft returns an error.", code: `def withdraw (acc : Account) (amount : Nat) : Except String Account :=
  if amount ≤ acc.lamports then
    .ok { acc with lamports := acc.lamports - amount }
  else
    ____ "insufficient funds"`, options: [".ok", ".error", "none", "return"], answer: 1, why: "Failures are built with <code>.error</code>. <code>.ok</code> is for success." },
  quiz: [
    { id: "u6q1", tag: "except", q: "What does <code>transfer alice bob 9000</code> return (alice has 5000)?", options: ["Except.ok with alice at 0", "Except.error \"insufficient funds: has 5000, needs 9000\"", "none", "Except.ok with alice at -4000"], a: 1, why: "9000 ≤ 5000 is false, so the else branch returns an error with a reason." },
    { id: "u6q2", tag: "do-notation", q: "Inside <code>do</code>, what does <code>←</code> do when the step returns an error?", options: ["Ignores the error and continues", "Stops and returns that error", "Retries the step", "Converts the error to 0"], a: 1, why: "← continues only on success. Like Rust's ?, it hands back the first error." },
    { id: "u6q3", tag: "rust-bridge", q: "Which Rust type matches <code>Except String α</code>?", options: ["Option&lt;α&gt;", "Result&lt;α, String&gt;", "Vec&lt;α&gt;", "Box&lt;α&gt;"], a: 1, why: "Result holds either Ok(value) or Err(error). Option has no reason attached to a failure." },
    { id: "u6q4", tag: "pairs", q: "Why does transfer return <code>Account × Account</code>?", options: ["Because Lean needs two return values for every function", "Because a transfer changes two accounts, so it returns both updated accounts", "It's a multiplication", "To store the error message"], a: 1, why: "× here builds a pair type, not a multiplication." }
  ],
  challenge: { id: "u6c1", tag: "invariant", q: "In twoTransfers, what is alice's balance plus bob's balance at the end?", options: ["6200", "6700", "5700", "5000"], a: 0, why: "3500 + 2700 = 6200, the same as at the start (5000 + 1200). Transfers move funds without creating any. You'll prove this in Unit 8." },
  practice: { task: "Write <code>#eval transfer bob alice 1200</code> (exactly bob's whole balance). Predict the result first, then check.", expected: "Except.ok ({ owner := \"bob\", lamports := 0 }, { owner := \"alice\", lamports := 6200 })" }
},
{
  id: "u7", n: 7, title: "Propositions and first proofs",
  hook: "State a fact as a type, then give Lean a proof that it checks. This is what makes Lean more than a programming language.",
  goals: ["Write a theorem: name, statement, proof", "Prove simple facts with rfl and decide", "Use the tactics intro, exact and omega", "Read Lean's error messages and the sorry warning"],
  explain: `
<p>A <b>theorem</b> looks just like a definition: <code>theorem name : statement := proof</code>. The statement is a <b>Prop</b> (Unit 1), and the proof is a value of that type. Lean checks the proof the same way it checks that <code>42</code> has type <code>Nat</code>. This idea is called <i>propositions as types</i>. <code>example</code> is a theorem without a name.</p>
<p><b>Proof terms you'll use first:</b> <code>rfl</code> proves <code>a = b</code> when both sides compute to the same thing. <code>by decide</code> asks Lean to just work out whether a concrete statement is true.</p>
<p><b>Tactic mode</b> starts with <code>by</code>. You give step-by-step instructions, and the Infoview shows the current <i>goal</i> after each step:</p>
<ul><li><code>intro h</code>: to prove "if P then Q", assume P (call that assumption h), then prove Q.</li>
<li><code>exact e</code>: "e is exactly the proof needed".</li>
<li><code>omega</code>: proves facts made of +, −, ≤ and &lt; over Nat and Int automatically.</li></ul>
<p><b>When it goes wrong</b>, Lean tells you precisely. A false claim proved <code>by decide</code> gives: <i>Tactic \`decide\` proved that the proposition 2 + 2 = 5 is false</i>. A proof left as <code>sorry</code> is accepted with a <b>warning</b>, <i>declaration uses \`sorry\`</i>. A theorem that uses sorry is <b>not</b> proved.</p>`,
  worked: { code: `example : 2 + 2 = 4 := rfl
theorem ether_in_wei : 10 ^ 18 = 1000000000000000000 := rfl
example : 21000 * 30 = 630000 := by decide

theorem add_zero_example (n : Nat) : n + 0 = n := rfl

example (p q : Prop) : p ∧ q → q ∧ p := by
  intro h
  exact And.intro h.2 h.1

theorem double_pos (n : Nat) (h : 0 < n) : 0 < 2 * n := by
  omega

#check ether_in_wei
#check @double_pos`,
    output: `ether_in_wei : 10 ^ 18 = 1000000000000000000
double_pos : ∀ (n : Nat), 0 < n → 0 < 2 * n`,
    notes: ["No output for a theorem means Lean accepted the proof. Silence is success.", "<code>add_zero_example</code> holds for <b>every</b> n, not just ones we tested.", "<code>p ∧ q</code> is \"p and q\". h.1 and h.2 are its two halves, so we swap them.", "The #check of double_pos reads: for every n, if 0 &lt; n then 0 &lt; 2n. <code>∀</code> means \"for all\"."] },
  bridge: `<p>A <b>test</b> checks some inputs, and a <b>proof</b> covers all of them. A Solidity or Rust test suite might try 1,000 balances. The Lean theorem <code>double_pos</code> covers every natural number there is. Every proof is checked by Lean's small <b>kernel</b> (see Unit 9), so you don't have to trust the person or the AI that wrote the proof, only the kernel.</p>`,
  faded: { prompt: "Pick the tactic that finishes this proof automatically (it's linear arithmetic on Nat).", code: `example (a b : Nat) (h : a ≤ b) : a - b = 0 := by
  ____`, options: ["rfl", "omega", "intro h", "sorry"], answer: 1, why: "omega handles +, −, ≤ over Nat, including truncated subtraction. sorry would leave the theorem unproved." },
  quiz: [
    { id: "u7q1", tag: "sorry", q: "A theorem's proof is <code>sorry</code>. What does Lean do?", options: ["Rejects the file with an error", "Accepts it with a warning, but the theorem is not actually proved", "Proves it automatically", "Deletes the theorem"], a: 1, why: "sorry is a placeholder. Lean warns \"declaration uses `sorry`\". Never trust a result that depends on sorry." },
    { id: "u7q2", tag: "rfl", q: "Which proof works for <code>example : 2 + 2 = 4</code>?", options: ["rfl", "intro h", "sorry is required", "omega is impossible here"], a: 0, why: "Both sides compute to 4, so rfl (reflexivity) proves it. decide or omega would work too." },
    { id: "u7q3", tag: "intro", q: "Your goal is <code>p ∧ q → q ∧ p</code>. What does <code>intro h</code> do?", options: ["Proves the goal immediately", "Assumes p ∧ q as h, leaving the goal q ∧ p", "Swaps p and q", "Introduces a new variable called p"], a: 1, why: "To prove an implication, you assume the left side and prove the right side." },
    { id: "u7q4", tag: "decide-error", q: "What happens with <code>theorem bad : 2 + 2 = 5 := by decide</code>?", options: ["It's accepted", "Lean reports that decide proved the proposition is false", "Lean warns about sorry", "It loops forever"], a: 1, why: "decide evaluates the claim, finds it false, and reports exactly that." },
    { id: "u7q5", tag: "proof-vs-test", q: "What does <code>double_pos</code> establish that tests cannot?", options: ["That the code runs fast", "That the statement holds for every natural number n", "That n is always even", "Nothing more than tests"], a: 1, why: "A theorem with ∀ covers all inputs. Tests only check the inputs someone picked." }
  ],
  challenge: { id: "u7c1", tag: "omega", q: "Which statement can <code>omega</code> prove?", options: ["∀ n : Nat, n * n ≥ n + 1", "∀ a b : Nat, a + b = b + a", "∀ s : String, s ++ \"\" = s", "2 + 2 = 5"], a: 1, why: "omega handles linear arithmetic: + and −, and multiplication by fixed numbers. n·n is not linear (and the first claim is false at n = 0 anyway). Strings are outside omega's domain." },
  practice: { task: "Type <code>theorem t (a b : Nat) (h : a ≤ b) : a - b = 0 := by omega</code>. Then change <code>by omega</code> to <code>by sorry</code> and read the warning.", expected: "No output for the omega version. With sorry: warning: declaration uses `sorry`" }
},
{
  id: "u8", n: 8, title: "Proving a contract invariant",
  hook: "Prove that your transfer can never create or destroy funds and never allows an overdraft, for every possible input.",
  goals: ["State a safety property of a transfer function as a theorem", "Follow unfold, split, simp, subst, omega step by step", "Prove a property about every list by induction", "Explain what the proof does and does not cover"],
  explain: `
<p>This is the payoff of Units 1–7. We take <code>transfer</code> from Unit 6 (here with a fixed error text) and prove three <b>invariants</b>, things that must always be true:</p>
<ol><li><b>Conservation</b>: if a transfer succeeds, the two balances add up to the same total afterwards.</li>
<li><b>No overdraft</b>: if a transfer succeeds, the amount was at most the sender's balance.</li>
<li><b>Rejection</b>: if the amount is more than the balance, the result is always the error.</li></ol>
<p><b>New tactics:</b> <code>unfold transfer at h</code> replaces the name with its definition. <code>split at h</code> splits the <code>if … then … else</code> into two cases, which the <code>·</code> bullets handle one at a time. <code>simp</code> simplifies using known facts. <code>obtain ⟨h1, h2⟩ := h</code> unpacks "A and B" into two facts. <code>subst</code> replaces a variable with what it equals. <code>assumption</code> finishes the goal when it's already one of your facts.</p>
<p><b>Induction</b> (last theorem): to prove something for every list, prove it for <code>[]</code>, then prove that if it holds for <code>rest</code> (the <i>induction hypothesis</i> <code>ih</code>) it holds for <code>a :: rest</code>. This is the same as proof by induction on numbers in first-year maths.</p>
<p><b>Read the limits honestly:</b> these theorems are about <i>this Lean model</i>. They say nothing yet about a deployed Solidity contract or Solana program. Closing that gap is exactly what the real projects in Unit 9 work on.</p>`,

  unfold transfer at h
  split at h
  · simp at h
    obtain ⟨h1, h2⟩ := h
    subst h1; subst h2
    simp
    omega
  · simp at h

theorem transfer_within_balance (src dst src' dst' : Account) (amount : Nat)
    (h : transfer src dst amount = .ok (src', dst')) :
    amount ≤ src.lamports := by
  unfold transfer at h
  split at h
  · assumption
  · simp at h

theorem transfer_rejects_overdraft (src dst : Account) (amount : Nat)

<ol>

<li><b>Compiler</b>: turns definitions into fast code. Lean is <i>bootstrapped</i>: it's written in Lean, so the repository keeps pre-built C files (<code>stage0</code>) to compile the first copy of itself.</li>

<p><b>What is a blockchain?</b> Imagine a notebook that lists who owns what. In a normal bank, one company keeps that notebook. On a <b>blockchain</b>, thousands of computers each keep a copy, and they follow the same rules to agree on every change. That is why no single company is in charge of it.</p>
<p><b>Ethereum and Solana</b> are two blockchains. Each has its own coin. Ethereum's coin is <b>ether</b> (written ETH). Solana's coin is <b>SOL</b>. An account on the blockchain holds a <b>balance</b>, which is how much of the coin it owns.</p>
<p><b>Tiny units.</b> Think of dollars and cents: you can pay £1 or 100p, and a shop never charges half a penny. Computers prefer whole numbers, so blockchains count money in the smallest piece:</p>
<ul>
<li>Ethereum: <b>wei</b>. 1 ether = 10<sup>18</sup> wei. That is a 1 followed by 18 zeros: 1,000,000,000,000,000,000.</li>
<li>Solana: <b>lamports</b>. 1 SOL = 1,000,000,000 lamports (a billion).</li>
</ul>
<p><b>Count the zeros.</b> To turn SOL into lamports, write the number of SOL and then <b>nine zeros</b> after it. The commas split the zeros into groups of three, so there are three groups:</p>
<div class="tbl"><table>
<thead><tr><th>SOL</th><th>Lamports</th><th>Zeros after the digit</th></tr></thead>
<tbody>
<tr><td>1 SOL</td><td>1,000,000,000</td><td>9 (000, 000, 000)</td></tr>
<tr><td>4 SOL</td><td>4,000,000,000</td><td>9 (000, 000, 000)</td></tr>
</tbody></table></div>
<p>When you type a number in a question you can leave the commas out, but you still need all nine zeros. A missing or extra zero is a different amount of money, so count them before you press the button.</p>
<p>So a balance is always stored as a whole number. That is why Unit 1 spends so long on whole numbers.</p>
<p><b>What is a smart contract?</b> It is a small program that lives on the blockchain and follows rules by itself. For example: "only move money out of this account if it holds enough." Ethereum contracts are commonly written in a language called <b>Solidity</b>. Solana programs are commonly written in <b>Rust</b>. You don't need to know either language for this course.</p>
<p><b>Why does Lean matter here?</b> A smart contract handles real money, and a mistake can be expensive. Programmers normally <b>test</b> their code: they try some inputs and check the answers. But tests only cover the inputs someone thought to try. Lean can check a <b>proof</b>: a step-by-step argument that something is true for <i>every</i> possible input, not just the ones you tried. That is why Lean is used on blockchain projects (you will see real ones in Unit 9).</p>
<p><b>The plan.</b> You learn Lean in small steps. Along the way you build a simple model of a bank account, and in Unit 8 you read a proof that a transfer never creates or destroys money.</p>

<ul>
<li><code>#eval</code> means "work this out and show me the answer". For example <code>#eval 2 + 3</code> shows <code>5</code>.</li>
<li><code>#check</code> means "don't work it out, just tell me what <b>kind</b> of thing this is". The kind is called its <b>type</b>. For example <code>#check 42</code> shows <code>42 : Nat</code>. Read the colon as "is a": 42 is a Nat.</li>
</ul>
<p>Every value has a type. A plain whole number like <code>42</code> is a Nat unless you tell Lean otherwise. These are the types you need now:</p>
<ul>
<li><b>Nat</b>: the counting numbers 0, 1, 2, 3 and so on. No fractions and <b>no negatives</b>. (Nat is short for "natural number".)</li>
<li><b>Int</b>: whole numbers that <i>can</i> be negative: …, −2, −1, 0, 1, 2, … (short for "integer").</li>
<li><b>String</b>: text, in double quotes, like <code>"wei"</code>.</li>
<li><b>Bool</b>: <code>true</code> or <code>false</code>.</li>
<li><b>Prop</b>: a <i>statement</i> that could be true or false, such as <code>3 ≤ 5</code> ("3 is less than or equal to 5"). You will prove statements like this in Unit 7.</li>
</ul>
<p><b>The big surprise: a Nat can never go below zero.</b> Think of counting apples. You have 5 and you take away 7. You can't have −2 apples, so Lean says <code>0</code>. This is called <i>truncated subtraction</i> ("cut off at zero"). Lean does <b>not</b> show an error. It just quietly gives 0.</p>
<p><b>Why this matters for money.</b> A token balance is a whole number that is never negative, so a Nat is a natural fit. But if someone tries to withdraw more than they have, then 5 − 7 quietly becomes 0 and nothing warns you. So the program has to check "is the amount at most the balance?" itself. Units 4, 6 and 8 build exactly that check.</p>
<p><b>The symbols in the example below:</b></p>
<ul>
<li><code>+</code> <code>-</code> <code>*</code> are plus, minus and times. <code>/</code> is divide and <code>%</code> is the remainder.</li>
<li><code>^</code> means "to the power of". For example <code>10 ^ 3</code> is 10 × 10 × 10 = 1000. So <code>10 ^ 18</code> is a 1 followed by 18 zeros. That is the number of wei in one ether (see Unit 0).</li>
<li><code>(5 : Int)</code> means "treat this 5 as an Int". The colon again reads "is a". Once the numbers are Ints, negatives are allowed, so 5 − 7 gives −2 like in normal maths.</li>
</ul>
<p><b>Typing the symbols.</b> Lean uses a few mathematical symbols (≤ ≥ → ∧ ∀). You can copy and paste them. On a keyboard Lean also accepts plain versions: <code>&lt;=</code> for ≤, <code>&gt;=</code> for ≥, <code>-&gt;</code> for → and <code>/\</code> for ∧. The VS Code extension also lets you type a backslash and a name, such as <code>\le</code> for ≤. In code the minus is always the ordinary hyphen <code>-</code>. The longer minus (−) in these explanations is only for reading.</p>`,
  worked: { notes: [
    "<code>2 + 3</code> is plain addition. The answer is 5.",
    "<code>10 ^ 18</code> is 10 to the power 18: a 1 followed by 18 zeros, the number of wei in one ether. Everything after <code>--</code> is a comment. Lean ignores it.",
    "<code>++</code> joins two pieces of text.",
    "<code>5 - 7</code> gives 0. Both numbers are Nat, a Nat can't go below zero, so Lean stops at 0 and doesn't complain.",
    "<code>/</code> on Nat is whole-number division: 2 fits into 7 three whole times, so the answer is 3. The leftover is dropped.",
    "<code>%</code> gives that leftover (the remainder): 7 % 2 is 1.",
    "<code>#check</code> shows types without computing. <code>42 : Nat</code> reads \"42 is a Nat\", and <code>\"wei\" : String</code> reads &quot;wei&quot; is a String.",
    "<code>3 ≤ 5</code> is a statement, so its type is Prop. <code>#check</code> doesn't decide whether it is true.",
    "<code>(5 : Int)</code> means \"treat this 5 as an Int\". Now negatives are allowed, so 5 − 7 is −2."
  ] },
  bridge: `<p class="muted">Skim this one. You won't be tested on the Solidity and Rust details.</p>
<p>The same sum, 5 − 7, behaves differently in three languages.</p>
<ul>
<li><b>Solidity</b> (Ethereum), since version 0.8.0: arithmetic on <code>uint256</code> is checked by default, so 5 − 7 makes the transaction <b>revert</b> (it is cancelled) instead of giving a wrong number. You can switch this off with <code>unchecked { }</code>.</li>
<li><b>Rust</b> (Solana): in debug builds an overflow <b>panics</b> (the program stops with an error). In release builds it <b>wraps around</b> unless overflow checks are turned on. Methods like <code>checked_sub</code> return an <code>Option</code>, a value that says whether there is an answer (you will meet Option in Unit 4).</li>
<li><b>Lean's Nat</b>: it never overflows (there is no biggest number) and it stops at 0.</li>
</ul>
<p>So the same sum can behave in three different ways, and the difference can matter when the number is someone's money.</p>`,
  practice: { task: "Open the Lean Playground (the Start here page shows how). Type the worked example one line at a time and look at the result for each line. Then try <code>#eval 10 ^ 9</code>, the number of wei in one gwei (a gwei is a small unit of ether: a billion wei)." }
},

u2: {
  hook: "Give a name to a value, and write small functions such as one that turns ether into wei.",
  goals: [
    "Give a value a name with def",
    "Write a function with inputs and an output type",
    "Call a function by writing its name and then its inputs, separated by spaces",
    "Read a function type such as Nat → Nat → Nat"
  ],
  summary: "<code>def</code> gives something a name. A function is a named rule: put something in, get something out. In Lean you call it with spaces, not brackets: <code>etherToWei 2</code>.",
  terms: [
    ["def", "Short for \"define\". It gives a name to a value or a function."],
    ["Function", "A rule that takes inputs and gives an output, like f(x) = 2x in maths."],
    ["Input / argument", "A value you hand to a function."],
    ["<code>:=</code>", "Read it as \"is defined as\". (It isn't the equals sign you use in maths.)"],
    ["Function type", "Written with arrows. <code>Nat → Nat</code> means \"give me a Nat and I give you a Nat\"."],
    ["Partial application", "Giving a function only some of its inputs. You get back a function that is still waiting for the rest."],
    ["fun", "Builds a function without giving it a name (an \"anonymous function\" or \"lambda\")."],
    ["Gas", "On Ethereum, the fee for running a transaction. A plain transfer of ether uses 21,000 units of gas."],
    ["Gwei", "A unit of ether: 1 gwei = 10^9 wei (a billion wei)."]
  ],
  explain: `
<p><b>Naming a value.</b> <code>def</code> (short for "define") gives a name to something. The pattern is <code>def name : Type := value</code>. Read it as "define <i>name</i>, which is a <i>Type</i>, to be <i>value</i>". For example <code>def weiPerEther : Nat := 10 ^ 18</code>. After that you can use <code>weiPerEther</code> anywhere below it. Naming a number once also stops you typing the wrong number of zeros twice.</p>
<p><b>Writing a function.</b> A function is a rule: you put something in and you get something out, like f(x) = 2x in maths. In Lean you list each input in brackets with its type, then the type of the answer, then the rule:</p>
<p><code>def etherToWei (eth : Nat) : Nat := eth * weiPerEther</code></p>
<ul>
<li><code>(eth : Nat)</code>: one input, called <code>eth</code>, which is a Nat.</li>
<li>the second <code>: Nat</code>: the answer is also a Nat.</li>
<li>after <code>:=</code>: the rule. Multiply the input by <code>weiPerEther</code>.</li>
</ul>
<p><b>Calling a function.</b> You don't put brackets or commas round the inputs. You write the name, a space, then the inputs: <code>etherToWei 2</code>. With two inputs it looks like <code>gasCost 21000 30</code>.</p>
<p>Brackets are only for <b>grouping</b>. In <code>double (double 5)</code> the inner call is worked out first, and its answer becomes the input of the outer call. Here is that evaluation one step at a time, where <code>double</code> multiplies its input by 2:</p>
<ol>
<li><code>double (double 5)</code>: Lean starts with the brackets, the inner call <code>double 5</code>.</li>
<li><code>double 5</code> is 5 * 2 = 10, so the whole line becomes <code>double 10</code>.</li>
<li><code>double 10</code> is 10 * 2 = 20. The answer is <code>20</code>.</li>
</ol>
<p>When you write nested calls, count the brackets: every opening bracket needs a closing one, and the call inside the brackets is the one that happens first.</p>
<p><b>Gas.</b> On Ethereum, running a transaction costs a fee called <b>gas</b>. A plain transfer of ether uses 21,000 units of gas. In this example the price of one unit is given in <b>gwei</b>, where 1 gwei = 10<sup>9</sup> wei. So the fee is the gas used × the price in gwei × 10<sup>9</sup>, and that is what <code>gasCost</code> works out.</p>
<p><b>Function types use arrows.</b> <code>Nat → Nat</code> means "give me a Nat and I will give you a Nat". A function with two Nat inputs and a Nat answer has the type <code>Nat → Nat → Nat</code>. If you give only the first input (<code>gasCost 21000</code>), you get back a function that is still waiting for the second one, with type <code>Nat → Nat</code>. This is called <i>partial application</i>.</p>
<p><b>Functions with no name.</b> <code>fun (n : Nat) => n * 2</code> is a function without a name. It means "take n and give back n × 2".</p>`,
  worked: { notes: [
    "1 ether = 10<sup>18</sup> wei, 1 gwei = 10<sup>9</sup> wei, and 1 SOL = 10<sup>9</sup> lamports. Each is defined once with <code>def</code> and named.",
    "<code>etherToWei 2</code> and <code>solToLamports 3</code> are calls: the name, a space, then the input. 2 ether is 2 × 10<sup>18</sup> wei and 3 SOL is 3,000,000,000 lamports.",
    "<code>#check etherToWei</code> shows the inputs and the output type.",
    "<code>(gasUsed gasPriceGwei : Nat)</code> is shorthand for two inputs that are both Nat.",
    "21,000 is the gas used by a plain ETH transfer. At a price of 30 gwei that costs 630,000,000,000,000 wei, which is 0.00063 ETH.",
    "<code>gasCost 21000</code> on its own is a function still waiting for the gas price, so its type is <code>Nat → Nat</code>.",
    "<code>fun (n : Nat) => n * 2</code> is a function without a name. Here it is given the name <code>double</code>, and <code>double 21</code> is 42."
  ] },
  bridge: `<p class="muted">Skim this one. You won't be tested on the Rust details.</p>
<p><b>Rust</b> has the same idea: <code>fn ether_to_wei(eth: u128) -&gt; u128 { eth * WEI_PER_ETHER }</code>.</p>
<p>Two differences to notice. Rust puts inputs in brackets with commas (<code>gas_cost(21000, 30)</code>), and Lean uses spaces (<code>gasCost 21000 30</code>). And Rust's <code>u128</code> has a biggest value while Lean's <code>Nat</code> does not. That matters later: a proof about unlimited Nats doesn't automatically hold for fixed-size integers.</p>`
},

u3: {
  hook: "Group related facts into one value, like a form with labelled boxes. Here: an account with an owner and a balance.",
  goals: [
    "Declare a structure with named fields",
    "Create a value and read one field with a dot",
    "Make an updated copy with { x with … }",
    "Explain why the original value doesn't change"
  ],
  summary: "A <b>structure</b> is a form with labelled boxes (fields). Lean never changes a value in place. To \"update\" something you make a changed copy, and the original stays as it was.",
  terms: [
    ["Structure", "A bundle of named pieces of data, like a form with labelled boxes."],
    ["Field", "One labelled box in a structure, for example <code>owner</code> or <code>lamports</code>."],
    ["Dot notation", "Reading a field with a dot: <code>alice.lamports</code> means \"alice's lamports\"."],
    ["deriving Repr", "Asks Lean to write the code that prints your structure. (Repr is short for \"representation\".)"],
    ["Immutable", "Cannot be changed. Lean values are immutable: you make a changed copy instead."],
    ["{ acc with … }", "\"Make a copy of acc, but change the named field.\""],
    ["Account", "On Solana, an account holds data and a balance of lamports. Here it is a structure with an owner and a balance."]
  ],
  explain: `
<p>A <b>structure</b> bundles several pieces of data into one thing, like a form with labelled boxes. We write <code>structure Account where</code> and then one box (a <b>field</b>) per line, each with its type.</p>
<p>To make one, you use curly brackets: <code>{ owner := "alice", lamports := 5000 }</code>. To read one box, you use a dot: <code>alice.lamports</code> means "the lamports of alice".</p>
<p><code>deriving Repr</code> asks Lean to make your structure printable. Always write it. In Lean 4.36, <code>#eval alice</code> happens to work without it, but other ways of printing the structure (such as <code>repr alice</code>) fail with an error.</p>
<p><b>Lean values never change.</b> Think of photocopying a form: <code>{ acc with lamports := … }</code> makes a <i>new copy</i> of the account and changes only the box you name. The original form is untouched. That is why <code>alice.lamports</code> is still 5000 after a deposit. Everything a function does shows up in what it <i>returns</i>, which makes it much easier to prove things about it later.</p>`,
  worked: { notes: [
    "<code>structure Account where</code> starts the form. The two boxes are indented underneath: an <code>owner</code> (text) and the <code>lamports</code> balance (a Nat).",
    "<code>def alice … := { owner := \"alice\", lamports := 5000 }</code> fills in the form. <code>#eval alice</code> prints it, and <code>alice.lamports</code> reads one box.",
    "<code>deposit</code> returns a <i>new</i> Account with 250 more lamports. That is the photocopy.",
    "The last line shows alice is still 5000. Nothing was changed in place."
  ] },
  bridge: `<p class="muted">Skim this one. You won't be tested on the Rust details.</p>
<p><b>Rust</b> has the same idea: <code>struct Account { owner: String, lamports: u64 }</code>. Every Solana account really does carry a <code>lamports</code> balance.</p>
<p>One difference: in Rust you would often write <code>fn deposit(acc: &amp;mut Account, amount: u64)</code>, which changes the account in place. Tools that translate Rust into Lean (such as <b>Aeneas</b>, which Microsoft uses to verify Rust cryptography) turn that kind of in-place change into a function that takes the old value and returns the new one, exactly like the Lean version above.</p>`
},

u4: {
  hook: "List every choice an instruction can be, then handle each one. Also meet Option, for answers that might not exist.",
  goals: [
    "Declare an inductive type with several choices",
    "Write a function that handles each choice (pattern matching)",
    "Use Option for an answer that might be missing",
    "Spot the bug that truncated subtraction causes"
  ],
  summary: "An <b>inductive type</b> is a menu of choices. Pattern matching says what to do for each choice, and Lean refuses your code if you forget one. <b>Option</b> is either <code>some answer</code> or <code>none</code>.",
  terms: [
    ["Inductive type", "A type defined by listing every possible choice (every shape a value can have)."],
    ["Constructor", "One choice in an inductive type. It can carry data, like <code>deposit (amount : Nat)</code> carries an amount."],
    ["Pattern matching", "Writing one line for each choice: \"if it is this, do that\"."],
    ["Exhaustive", "Covers every choice. Lean checks this and rejects your code if a case is missing."],
    ["Option", "A value that is either <code>some x</code> (here is the answer) or <code>none</code> (there is no answer)."],
    ["Instruction", "On Solana, a command sent to a program. Here it is a menu of three: deposit, withdraw or close."],
    ["<code>s!\"…\"</code>", "Builds text with values put inside the curly brackets, like <code>s!\"deposit {n}\"</code>."]
  ],
  explain: `
<p>An <b>inductive type</b> lists <i>every possible choice</i> a value can be, like a menu where you must pick exactly one item. Each choice is a <b>constructor</b>, written after a <code>|</code>, and a choice can carry data: <code>| deposit (amount : Nat)</code> is "a deposit, and here is the amount".</p>
<p>To use one you write a function that handles each choice. This is called <b>pattern matching</b>: one line per choice, and Lean picks the line that fits. <code>.deposit n</code> is a short way to write <code>Instruction.deposit n</code>. If you leave a choice out, Lean <b>refuses the definition</b> with an error (it says which case is missing). So a forgotten case is caught right away, not found later as a bug.</p>
<p>Look at how <code>describe</code> is written. It has no named input: <code>def describe : Instruction → String</code> just says "takes an Instruction, gives a String", and the <code>|</code> lines below say what to do for each choice. In <code>.deposit n</code>, the <code>n</code> is a name for the amount that came with the deposit.</p>
<p><code>s!"deposit {n}"</code> builds a piece of text and puts the value of <code>n</code> inside it.</p>
<p><b>Look closely at the worked example.</b> <code>applyIx 500 (.withdraw 900)</code> gives 0. Someone withdrew 900 from a balance of 500 and nothing complained. That is truncated subtraction from Unit 1 turning into a real bug.</p>
<p>The fix is <b>Option</b>. An Option is either <code>some x</code> ("here is the answer") or <code>none</code> ("there is no valid answer"). The function <code>safeWithdraw</code> checks first, and gives back <code>none</code> instead of pretending.</p>`,
  worked: { notes: [
    "<code>inductive Instruction</code> lists three choices: deposit, withdraw and close. The first two carry an amount.",
    "<code>describe</code> has one line per choice. <code>describe (.deposit 100)</code> picks the deposit line, so the text is \"deposit 100\".",
    "<code>applyIx 500 (.withdraw 200)</code>: the brackets make <code>.withdraw 200</code> one input. 500 − 200 is 300, as expected.",
    "<code>applyIx 500 (.withdraw 900)</code> gives 0. That is the silent bug: 900 is more than the balance and nothing warned us.",
    "<code>safeWithdraw</code> checks <code>amount ≤ balance</code> first. If it isn't allowed, the answer is <code>none</code>. Otherwise it is <code>some</code> of the new balance.",
    "<code>some 300</code> means \"yes, and the new balance is 300\". <code>none</code> means \"not allowed\"."
  ] },
  bridge: `<p class="muted">Skim this one. You won't be tested on the Rust details.</p>
<p><b>Rust</b> has the same idea. An inductive type is Rust's <b>enum</b>: <code>enum Instruction { Deposit(u64), Withdraw(u64), Close }</code>, handled with a <code>match</code>. Rust also rejects a <code>match</code> that misses a case.</p>
<p>This is the shape commonly used to read and dispatch the instructions a Solana program receives. Lean's <code>Option</code> (<code>some</code> / <code>none</code>) is Rust's <code>Option</code> (<code>Some</code> / <code>None</code>).</p>`
},

u5: {
  hook: "Keep many accounts in a list, and add up the total with a function that calls itself.",
  goals: [
    "Write lists, and use :: and ++",
    "Write a function that calls itself on a smaller list (recursion)",
    "Use map, filter and foldl",
    "Explain why this kind of recursion must finish"
  ],
  summary: "A list is either empty or one item in front of a shorter list. A function on a list handles those two cases, and in the second case it calls itself on the shorter list. That is <b>recursion</b>.",
  terms: [
    ["List", "Items of one type kept in order, like <code>[1, 2, 3]</code>."],
    ["<code>[]</code>", "The empty list."],
    ["<code>::</code>", "Puts one item on the front of a list. <code>0 :: [1, 2]</code> is <code>[0, 1, 2]</code>."],
    ["Recursion", "A function that uses itself on a smaller piece of the problem, like counting a stack of coins by removing one coin at a time."],
    ["map", "Applies a function to every item in a list and gives a new list."],
    ["filter", "Keeps only the items that pass a test."],
    ["foldl", "Walks along a list from the left, carrying a running total."],
    ["Total supply", "The sum of all the balances. Here: the lamports of all accounts added together."],
    ["Termination", "Making sure a function finishes. Lean checks that each recursive call works on something smaller."],
    ["<code>_</code>", "\"There is something here, but I don't need its name.\""]
  ],
  explain: `
<p>A <b>List</b> keeps items of one type in order: <code>[1, 2, 3]</code>. Every list is one of two things: <b>empty</b>, written <code>[]</code>, or <b>one item stuck on the front of a shorter list</b>, written <code>a :: rest</code>. (Read <code>::</code> as "followed by".) In Lean's own source code those two shapes are called <code>nil</code> and <code>cons</code>.</p>
<p>So a function on a list usually has <b>two cases</b>: what to do with the empty list, and what to do with <code>a :: rest</code>. In the second case, the function calls <i>itself</i> on the shorter list <code>rest</code>. That is <b>recursion</b>. Think of counting a stack of coins: if the stack is empty the count is 0, otherwise it is 1 plus the count of the rest of the stack.</p>
<p>Because <code>rest</code> is always shorter, you eventually reach <code>[]</code> and the function stops. Lean checks this. If a function might go on forever, Lean rejects it.</p>
<p>Three ready-made tools:</p>
<ul>
<li><code>map</code> applies a function to <i>every</i> item and gives a new list.</li>
<li><code>filter</code> keeps only the items that pass a test.</li>
<li><code>foldl</code> walks along the list carrying a running total.</li>
</ul>
<p><code>++</code> joins two lists: <code>[1, 2] ++ [3]</code> is <code>[1, 2, 3]</code>.</p>
<p>Two bits of shorthand. <code>fun a => a.lamports</code> is a function with no name: "take a, give back its lamports". <code>(·.owner)</code> is the same kind of thing with the name left out. The <code>·</code> stands for the item being passed in, so it means "take an account, give back its owner".</p>
<p><code>foldl f start list</code> goes along the list from the left. It begins with <code>start</code>. At each item, <code>f</code> is given the running total so far and the next item, and returns the new running total. So <code>foldl (fun acc a => acc + a.lamports) 0 accounts</code> starts at 0 and adds each account's lamports.</p>
<p>You'll also see <code>accounts.map …</code>. Writing <code>x.f</code> calls the function <code>f</code> on <code>x</code>, so <code>accounts.map g</code> is the same as <code>List.map g accounts</code>.</p>`,
  worked: { notes: [
    "This uses the Account structure from Unit 3. <code>accounts</code> is a list of three of them.",
    "<code>total</code> has two cases. The empty list adds up to 0. Otherwise it is this account's lamports plus the total of the rest. The total of all balances is a \"total supply\" calculation.",
    "<code>map (·.owner)</code> takes each account and keeps only its owner.",
    "<code>filter</code> keeps the accounts with at least 1000 lamports (alice and bob), and then <code>map</code> takes their owners.",
    "<code>foldl</code> gets the same 6500 as <code>total</code>, by carrying a running sum that starts at 0.",
    "<code>0 :: [1, 2]</code> puts 0 on the front, giving <code>[0, 1, 2]</code>."
  ] },
  bridge: `<p class="muted">Skim this one. You won't be tested on the Rust details.</p>
<p><b>Rust</b>: <code>accounts.iter().map(|a| a.lamports).sum::&lt;u64&gt;()</code>. It is the same idea in different spelling.</p>
<p>In blockchain terms, <code>total</code> is a <i>total supply</i> calculation. In Unit 8 you'll see a proof of a fact about it for <i>every possible list</i>, which no number of tests can do.</p>`
},

u6: {
  hook: "Give back either a success or a clear reason for failure. This is Lean's version of Solidity's require and Rust's Result.",
  goals: [
    "Use Except to return ok or an error",
    "Write a transfer that refuses overdrafts",
    "Chain steps with do and ←, stopping at the first failure",
    "Compare Except with Rust's Result and Solidity's require"
  ],
  summary: "<b>Except</b> is a value that is either a success (<code>.ok</code>) or a failure with a reason (<code>.error</code>). Inside <code>do</code>, the arrow <code>←</code> stops at the first failure.",
  terms: [
    ["Except", "A value that is either a success or an error with a reason. <code>Except String Account</code> means \"an error message, or an Account\"."],
    ["<code>.ok</code> / <code>.error</code>", "Build a success or a failure."],
    ["Pair", "Two values together, written <code>(a, b)</code>. Its type is written <code>Account × Account</code>."],
    ["do", "Lets you write steps one after the other."],
    ["<code>←</code>", "\"Run this step. If it worked, carry on with its result. If it failed, stop and return that failure.\""],
    ["return", "Wraps the final answer as a success."],
    ["require", "A Solidity check that cancels the whole transaction if a condition is false."],
    ["Result", "Rust's type that is either <code>Ok</code> or <code>Err</code>."]
  ],
  explain: `
<p><code>Except E A</code> means "either an error of type E, or a success of type A". (Lean writes the blanks as the Greek letters ε and α. Think of them as gaps to fill in.) Here the error is a piece of text, so E is <code>String</code> and we write <code>Except String …</code>. You make a success with <code>.ok value</code> and a failure with <code>.error reason</code>.</p>
<p>Two small words you'll see. <code>if … then … else …</code> picks one of two answers depending on a yes/no condition. <code>let x ← …</code> gives a name to a result so you can use it in the lines below.</p>
<p><code>Account × Account</code> is a <b>pair</b> type: two accounts together, written <code>(a, b)</code>. (The × here isn't multiplication.) A transfer changes two accounts, the sender and the receiver, so it returns a pair.</p>
<p><b>do-notation</b> lets you write steps one after another. The line <code>let (a1, b1) ← transfer …</code> means: run the transfer; if it worked, unpack the pair and carry on; if it failed, <b>stop</b> and return that failure. <code>return</code> wraps the final answer as a success.</p>
