<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Lean 4</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9c3d1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#faf6ee; --card:#fffdf8; --ink:#26211b; --muted:#6a6256; --rule:#d9cfbe;
  --accent:#9c3d1a; --accent-ink:#fffaf3; --accent-soft:#f3e6d6;
  --good:#37643a; --good-bg:#e7eedc; --bad:#9a2a2a; --bad-bg:#f6e2dd; --warn:#79580a; --warn-bg:#f4ead0;
  --code:#efe8da;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1c1915; --card:#24201b; --ink:#ece5d8; --muted:#a79e8f; --rule:#3b352c;
    --accent:#e58f5c; --accent-ink:#1c1915; --accent-soft:#33281c;
    --good:#8fc48a; --good-bg:#1f2b1d; --bad:#ee8f86; --bad-bg:#3a201d; --warn:#e3c06b; --warn-bg:#352b14;
    --code:#171410;
  }
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.6}
a{color:var(--accent)}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:10}
.skip:focus{left:0}
header.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:56rem;margin:0 auto;padding:.9rem 18px .6rem}
.brand{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.sub{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem 1rem;align-items:baseline;margin-top:.25rem}
nav{display:flex;flex-wrap:wrap;gap:.1rem 1.1rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.86rem}
nav a{color:var(--muted);text-decoration:none;padding:.15rem 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#today{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.8rem;color:var(--muted)}
main{max-width:56rem;margin:0 auto;padding:1rem 18px 3rem;outline:none}
footer{max-width:56rem;margin:0 auto;padding:1.2rem 18px 2.5rem;border-top:1px solid var(--rule);color:var(--muted);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.8rem}
h1{font-size:1.85rem;line-height:1.2;margin:.6rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.28rem;margin:1.7rem 0 .45rem;line-height:1.25}
h3{font-size:1.05rem;margin:1.1rem 0 .3rem}
p{margin:.55rem 0}
.muted{color:var(--muted)}
.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.9rem 1.1rem;margin:.9rem 0}
.card>h2:first-child{margin-top:.2rem}
.note{border-left:3px solid var(--muted);padding:.1rem 0 .1rem .9rem;margin:.9rem 0;color:var(--ink)}
.note.todo{border-left-color:var(--accent);background:var(--accent-soft);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.short{border-left-color:var(--good);background:var(--good-bg);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.mode{border-left-color:var(--warn);background:var(--warn-bg);padding:.55rem .9rem;border-radius:0 3px 3px 0}
.note.mode.challenge{border-left-color:var(--good);background:var(--good-bg)}
.warn{background:var(--warn-bg);border:1px solid var(--warn);padding:.55rem .9rem;border-radius:3px;margin:.8rem 0;font-size:.95rem}
code{background:var(--code);padding:.05rem .3rem;border-radius:2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
pre{background:var(--code);padding:.7rem .9rem;border-radius:3px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.5;margin:.5rem 0;white-space:pre}
pre.out{border-left:3px solid var(--good)}
.label{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.8rem 0 .15rem;font-weight:600}
button,.btn{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.9rem;cursor:pointer;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:.45rem .95rem;margin:.25rem .4rem .25rem 0;text-decoration:none;display:inline-block}
button.secondary{background:transparent;color:var(--accent)}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea,input[type=text],input[type=search]{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:.55rem .65rem}
textarea.prose{font-family:inherit;font-size:1rem}
input[type=search]{max-width:26rem;font-family:inherit}
/* course map */
.chain{display:flex;flex-wrap:wrap;gap:.7rem .15rem;list-style:none;padding:0;margin:1rem 0}
.chain li{display:flex;align-items:center}
.chain li+li::before{content:"\203A";color:var(--muted);padding:0 .35rem;font-size:1.3rem}
.block{width:10.6rem;min-height:8.6rem;display:flex;flex-direction:column;border:1px solid var(--ink);border-radius:2px;padding:.6rem .7rem;background:var(--card);text-decoration:none;color:var(--ink)}
.block .n{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.block .t{font-weight:700;margin:.1rem 0 .4rem;flex:1;font-size:.95rem;line-height:1.25}
.block .st{font-family:system-ui,sans-serif;font-size:.78rem;font-weight:600;margin-bottom:.3rem}
.block.open{border:2px solid var(--accent)}
.block.open .st{color:var(--accent)}
.block.mastered{background:var(--good-bg);border-color:var(--good)}
.block.mastered .st{color:var(--good)}
.block.locked{border:1px dashed var(--muted);color:var(--muted);background:transparent;cursor:not-allowed}
a.block:hover{background:var(--accent-soft)}
.bar{position:relative;height:.45rem;background:var(--code);border:1px solid var(--rule)}
.bar>i{display:block;height:100%;background:var(--accent)}
.block.mastered .bar>i{background:var(--good)}
.bar>b{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.barlabel{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--muted)}
/* unit */
.stepper{display:flex;flex-wrap:wrap;gap:.2rem .3rem;margin:.7rem 0;border-bottom:1px solid var(--rule);padding-bottom:.5rem}
.stepper button{margin:0;background:transparent;color:var(--muted);border-color:transparent;font-size:.84rem;padding:.3rem .55rem;border-radius:2px}
.stepper button:hover{color:var(--ink);background:var(--accent-soft)}
.stepper button[aria-current="step"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.explain p,.explain li{max-width:42rem}
.opt{display:block;border:1px solid var(--rule);border-radius:3px;padding:.45rem .75rem;margin:.35rem 0;cursor:pointer;background:var(--card)}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-right:.55rem}
.opt.correct{border-color:var(--good);background:var(--good-bg);cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.opt .mark{font-family:system-ui,sans-serif;font-weight:700;margin-left:.5rem;font-size:.8rem}
.conf{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0;font-family:system-ui,sans-serif;font-size:.9rem}
.conf label{border:1px solid var(--rule);border-radius:3px;padding:.28rem .85rem;cursor:pointer;background:var(--card)}
.conf label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;font-weight:700;margin-bottom:.4rem}
.fb{border-radius:3px;padding:.65rem .9rem;margin:.7rem 0}
.fb.ok{background:var(--good-bg);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.sure-wrong{outline:2px dashed var(--warn)}
.tagline{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.7rem}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.55rem .8rem}
.stat b{display:block;font-size:1.5rem}
.stat small{color:var(--muted);font-family:system-ui,sans-serif}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
th,td{border-bottom:1px solid var(--rule);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
dl.terms{margin:.3rem 0}
dl.terms dt{font-weight:700;margin-top:.55rem}
dl.terms dd{margin:.1rem 0 0 0}
ul.marks{list-style:none;padding:0;font-family:system-ui,sans-serif;font-size:.92rem}
ul.marks li{padding:.28rem 0;border-bottom:1px solid var(--rule)}
.m-ok{color:var(--good);font-weight:700}.m-no{color:var(--bad);font-weight:700}
.check li{list-style:none;margin:.2rem 0}
.check{padding-left:0;font-family:system-ui,sans-serif;font-size:.92rem}
details{margin:.5rem 0}
summary{cursor:pointer;font-weight:700}
.msg{min-height:1.4rem;font-weight:600;font-family:system-ui,sans-serif;font-size:.9rem}
.cmp td:first-child,.cmp th:first-child{width:2rem}
@media (max-width:560px){ html{font-size:17px} .block{width:100%} .chain li{width:100%} .chain li+li::before{content:"\2193"} .chain{flex-direction:column} .chain li{flex-direction:column;align-items:stretch} }
@media print{ header.top,.stepper,button,footer{display:none} }
</style>
</head>

<a class="skip" href="#app">Skip to content</a>
<header class="top"><div class="top-in">
  <a class="brand" href="#/map">Learn Lean 4</a>
  <div class="sub">
    <nav id="nav" aria-label="Main"></nav>
    <span id="today"></span>
  </div>
</div></header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<noscript><p style="padding:1rem">This page needs JavaScript to run.</p></noscript>

<script>

<script>
"use strict";
/* ===================== constants ===================== */
const BUILT = "/*__BUILT__*/";             // date of the build, YYYY-MM-DD
const KEY = "leandash.v1";                 // storage key (unchanged so earlier progress is kept)
const SALT = "learn-lean-4|v2|";
const DAY = 86400000;
const BOXES = [1, 3, 7, 14, 30];           // Leitner box intervals in days
const PASS_PCT = 80;                       // mastery gate
const PACE = { window: 20, supportBelowPct: 60, supportMinAnswers: 5, challengeAtPct: 85, challengeMinAnswers: 10 };
const IDLE_MS = 120000;                    // 2 minutes without interaction = idle
const LOG_CAP = 1500;
const SLOW_MS = 60000;
const REVIEW_BATCH = 20;
const MIN_FIX = 12;                        // characters needed in the "what went wrong" note
const MIN_PREDICT = 3, MIN_EXPLAIN = 25;
let RUSH_MS = window.__LEAN_TEST && typeof window.__RUSH_MS === "number" ? window.__RUSH_MS : 3000;   // a multiple-choice answer faster than this earns half credit
const CONF_LABEL = { sure: "Sure", unsure: "Unsure", guess: "Guessing" };
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

/* ===================== content lookup ===================== */
const UMAP = {}, QMAP = {};
UNITS.forEach(u => {
  UMAP[u.id] = u;
  u.quiz.forEach(q => { QMAP[q.id] = { q, u }; });
  QMAP[u.challenge.id] = { q: u.challenge, u };
});
function qinfo(id) {                       // static or generated question id -> { u, tag, label, q? }
  if (QMAP[id]) return { u: QMAP[id].u, tag: QMAP[id].q.tag, q: QMAP[id].q, gen: false };
  const g = GENMAP[id];
  return g ? { u: UMAP[g.unit], tag: g.tag, gen: true } : null;
}
function knownQ(id) { return !!(QMAP[id] || GENMAP[id]); }

/* ===================== helpers ===================== */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "value") e.value = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function plain(html) { return (new DOMParser().parseFromString(html, "text/html").body.textContent || "").replace(/\s+/g, " ").trim(); }
function rndInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
const R = { int: (lo, hi) => lo + rndInt(hi - lo + 1), chance: p => rndInt(1000000) / 1000000 < p };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rndInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pad(n) { return String(n).padStart(2, "0"); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(ts, k) { const d = new Date(startOfDay(ts)); d.setDate(d.getDate() + k); return d.getTime(); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function tagName(t) { return t.replace(/-/g, " "); }
function link(text, href) { return h("a", { href, target: "_blank", rel: "noopener noreferrer" }, text); }
function normAns(s) { return String(s).toLowerCase().replace(/[\s,_]/g, ""); }
function prettyDate(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? Number(m[3]) + " " + MONTHS[Number(m[2]) - 1] + " " + m[1] : iso; }

/* SHA-256 (used to sign saved progress so edits made outside the app can be noticed) */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = "length", i, j, result = "";
  var words = [], asciiBitLength = ascii[lengthProperty] * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k[lengthProperty];
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += "\x80";
  while (ascii[lengthProperty] % 64 - 56) ascii += "\x00";
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return "";
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10)) | 0));
      var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : "") + b.toString(16); }
  return result;
}
function signText(text) { return sha256(unescape(encodeURIComponent(SALT + text))); }

/* ===================== state + storage ===================== */
function blank() { return { v: 1, created: Date.now(), log: [], units: {}, cards: {}, secs: {}, faded: {}, notes: "", lastBackup: 0 }; }
let S = blank();
let storageOK = true, skippedOnLoad = 0;
let integrity = "new";                     // new | ok | legacy | edited
function num(x) { return typeof x === "number" && isFinite(x) ? x : null; }
const EMPTY_PREP = () => ({ read: false, predict: false, faded: false, explain: false });

/* Checks the signature on a parsed backup/storage object. Returns "ok", "none" or "edited". */
function checkSig(raw) {
  if (!raw || typeof raw !== "object" || typeof raw.sig !== "string") return "none";
  const rest = Object.assign({}, raw); delete rest.sig;
  return signText(JSON.stringify(rest)) === raw.sig ? "ok" : "edited";
}
/* Cleans untrusted data (storage or import). Returns a clean state object. */
function sanitize(o) {
  if (!o || typeof o !== "object" || o.v !== 1) throw new Error("This is not Learn Lean 4 progress data (expected version 1).");
  const s = blank(); let skipped = 0;
  s.created = num(o.created) || Date.now();
  const confs = [null, "sure", "unsure", "guess"], kinds = ["quiz", "review", "faded", "predict"];
  if (Array.isArray(o.log)) for (const e of o.log) {
    if (!e || typeof e !== "object" || !kinds.includes(e.kind) || !confs.includes(e.conf === undefined ? null : e.conf) ||
        num(e.t) === null || typeof e.ok !== "boolean" || typeof e.u !== "string" || !UMAP[e.u] || typeof e.q !== "string") { skipped++; continue; }
    if ((e.kind === "quiz" || e.kind === "review") && !knownQ(e.q)) { skipped++; continue; }
    const ent = { t: e.t, u: e.u, q: e.q, kind: e.kind, ok: e.ok, conf: e.conf || null, ms: num(e.ms) === null ? null : Math.max(0, Math.min(e.ms, 600000)) };
    if (e.kind === "faded") ent.first = e.first === true;
    if (typeof e.fix === "string" && e.fix) ent.fix = e.fix.slice(0, 300);
    s.log.push(ent);
  }
  s.log = s.log.slice(-LOG_CAP);
  if (o.units && typeof o.units === "object") for (const id of Object.keys(UMAP)) {
    const x = o.units[id]; if (!x || typeof x !== "object") continue;
    const hist = (Array.isArray(x.history) ? x.history : []).filter(a => a && num(a.t) !== null && num(a.right) !== null && num(a.total) !== null && a.total > 0 && a.right >= 0 && a.right <= a.total)
      .map(a => { const sc = num(a.score); return { t: a.t, right: Math.floor(a.right), total: Math.floor(a.total), score: sc === null ? pct(a.right, a.total) : Math.max(0, Math.min(100, Math.round(sc))) }; }).slice(-30);
    const best = Math.max(0, Math.min(100, num(x.best) || 0));
    const backed = hist.length ? hist.some(a => a.score >= PASS_PCT) : best >= PASS_PCT;      // mastery must be backed by a passing attempt
    const prep = EMPTY_PREP(); if (x.prep && typeof x.prep === "object") Object.keys(prep).forEach(k => { prep[k] = x.prep[k] === true; });
    const ex = x.explain && typeof x.explain === "object" && typeof x.explain.text === "string" ? { text: x.explain.text.slice(0, 1500), rating: ["covered", "partly", "missed"].includes(x.explain.rating) ? x.explain.rating : "partly", t: num(x.explain.t) || 0 } : null;
    s.units[id] = { best, mastered: x.mastered === true && backed, attempts: Math.max(0, Math.floor(num(x.attempts) || 0)), practice: x.practice === true, history: hist, prep, explain: ex };
  }
  if (o.cards && typeof o.cards === "object") for (const id of Object.keys(o.cards)) {
    if (!knownQ(id)) continue;
    const c = o.cards[id]; if (!c || typeof c !== "object") continue;
    const box = Math.floor(num(c.box) || 0), due = num(c.due);
    if (box >= 1 && box <= 5 && due !== null) s.cards[id] = { box, due };
  }
  if (o.secs && typeof o.secs === "object") for (const k of Object.keys(o.secs)) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && num(o.secs[k]) !== null && o.secs[k] >= 0) s.secs[k] = o.secs[k];
  }
  if (o.faded && typeof o.faded === "object") for (const id of Object.keys(UMAP)) {
    const f = o.faded[id]; if (!f || typeof f !== "object") continue;
    s.faded[id] = { first: f.first === true ? true : f.first === false ? false : null, tries: Math.max(0, Math.floor(num(f.tries) || 0)) };
  }
  s.notes = typeof o.notes === "string" ? o.notes.slice(0, 5000) : "";
  s.lastBackup = num(o.lastBackup) || 0;
  s._skipped = skipped;
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);

  if (kind === "quiz" && q.type !== "typed" && ms < RUSH_MS) return { credit: 0.5, why: "Counted as half, because it took under " + Math.round(RUSH_MS / 1000) + " seconds. Read the whole question before you answer." };

}
function runQuestions(mount, items, kind, onFinish, opts) {

    const perm = typed ? null : shuffle(q.options.map((_, k) => k));       // options are shown in a new order every time
    let picked = null, conf = null, typedVal = ""; const t0 = Date.now();
    if (window.__LEAN_TEST) window.__expected = () => typed ? { type: "typed", answer: q.answer } : { type: "mc", index: perm.indexOf(q.a), n: perm.length, perm: perm.slice(), id: q.id };
    mount.replaceChildren();

    if (opts.keyIdeas) form.append(h("div", { class: "note mode support" }, h("b", null, "Key ideas for this unit (concept: " + tagName(q.tag) + ")"), h("ul", null, it.u.goals.map(g => h("li", null, g)))));

    const submit = h("button", { disabled: true, onclick: doSubmit }, "Check my answer");
    const upd = () => { submit.disabled = !((typed ? typedVal.trim().length > 0 : picked !== null) && conf !== null); };
    if (typed) {
      fs.append(h("input", { type: "text", name: "typed", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Your answer", placeholder: q.hint || "", oninput: ev => { typedVal = ev.target.value; upd(); } }));
      fs.append(h("p", { class: "muted ui", style: "font-size:.8rem" }, "Type what Lean would print. Spaces and capital letters don't matter."));
    } else {

    }

    const cf = h("fieldset", null, h("legend", null, "How sure are you? (choose before you check)"));
    const row = h("div", { class: "conf" });
    [["sure", "Sure"], ["unsure", "Unsure"], ["guess", "Guessing"]].forEach(([v, l]) =>

    cf.append(row); form.append(cf, submit);

    function doSubmit() {

      const ms = Math.min(Date.now() - t0, 600000);
      const cr = creditFor(ok, conf, ms, q, kind);
      const before = S.cards[q.id] ? S.cards[q.id].box : null;
      const entry = { t: Date.now(), u: it.u.id, q: q.id, kind, ok, conf, ms };
      S.log.push(entry);
      recordCard(q.id, ok, kind === "review");

        fixBox = h("textarea", { id: "fixnote", class: "prose", rows: "2", maxlength: "300", placeholder: "Write it in your own words", oninput: () => { next.disabled = fixBox.value.trim().length < MIN_FIX; } });
        card.append(fixBox);
        card.append(h("p", { class: "muted ui", style: "font-size:.8rem" }, "At least " + MIN_FIX + " characters. Putting the correction into words is what makes it stick."));
      }

  L.push("");
  L.push("ANSWERS (quiz + review, last 7 days)");

  L.push("Accuracy by unit:");

  UNITS.forEach(u => { const a = ans.filter(e => e.u === u.id); if (a.length) { any = true; const r = a.filter(e => e.ok).length; L.push("- Unit " + u.n + " " + u.title + ": " + r + "/" + a.length + " (" + pct(r, a.length) + "%)"); } });
  if (!any) L.push("- (none)");
  const tags = {};
  ans.forEach(e => { const t = qinfo(e.q).tag; (tags[t] = tags[t] || { n: 0, r: 0 }); tags[t].n++; if (e.ok) tags[t].r++; });
  const weak = Object.entries(tags).filter(([, v]) => v.n >= 2 && v.r < v.n).sort((a, b) => (a[1].r / a[1].n) - (b[1].r / b[1].n) || b[1].n - a[1].n).slice(0, 5);

  const cw = ans.filter(e => e.conf === "sure" && !e.ok);
  L.push("Confident but wrong (marked Sure, answered wrong): " + cw.length);
  cw.slice(-10).forEach(e => { const x = qinfo(e.q); L.push("- Unit " + x.u.n + " [" + x.tag + "]" + (x.q ? " \"" + plain(x.q.q).slice(0, 90) + "\"" : " (generated question)") + (e.fix ? " my note: " + e.fix : "")); });
  const slow = ans.filter(e => e.ms !== null && e.ms >= SLOW_MS).sort((a, b) => b.ms - a.ms);
  L.push("Slow questions (took over " + SLOW_MS / 1000 + " seconds to answer): " + slow.length);
  slow.slice(0, 5).forEach(e => { const x = qinfo(e.q); L.push("- Unit " + x.u.n + " [" + x.tag + "] " + Math.round(e.ms / 1000) + "s " + (e.ok ? "right" : "wrong")); });

  L.push("REQUEST");
